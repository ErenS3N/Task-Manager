<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline';"
    />
    <title>Task Detail</title>
  </head>
  <body>
    <div class="detail-app">
      <header class="detail-header">
        <h1>Task Details</h1>
      </header>

      <main class="detail-content">
        <dl class="detail-list">
          <div class="detail-row">
            <dt>ID</dt>
            <dd id="detail-id"></dd>
          </div>
          <div class="detail-row">
            <dt>Title</dt>
            <dd id="detail-title"></dd>
          </div>
          <div class="detail-row">
            <dt>Priority</dt>
            <dd id="detail-priority"></dd>
          </div>
          <div class="detail-row">
            <dt>Status</dt>
            <dd id="detail-status"></dd>
          </div>
          <div class="detail-row">
            <dt>Created</dt>
            <dd id="detail-created"></dd>
          </div>
          <div class="detail-row">
            <dt>Last Updated</dt>
            <dd id="detail-updated"></dd>
          </div>
        </dl>

        <section class="detail-notes" aria-labelledby="detail-notes-label">
          <div class="detail-notes-heading">
            <h2 id="detail-notes-label">Notes</h2>
            <button id="btn-edit-notes" class="detail-button" type="button">Edit</button>
          </div>
          <p id="detail-notes" class="detail-notes-value"></p>
          <div id="notes-editor" class="notes-editor" hidden>
            <textarea id="notes-input" aria-labelledby="detail-notes-label" maxlength="500" rows="5"></textarea>
            <p id="notes-error" class="notes-error" role="alert" hidden></p>
          </div>
        </section>
      </main>

      <footer class="detail-footer">
        <button id="btn-close-detail" class="detail-button" type="button">Close</button>
        <div id="notes-actions" class="notes-actions" hidden>
          <button id="btn-cancel-notes" class="detail-button" type="button">Cancel</button>
          <button id="btn-save-notes" class="detail-button detail-button-primary" type="button">Save Changes</button>
        </div>
      </footer>
    </div>
  </body>
</html>
